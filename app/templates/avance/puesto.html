<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d1d1b">
<title>Mi puesto · {{ request.taller.nombre }}</title>
<style>
  :root { --fondo:#f6f5f2; --panel:#fff; --texto:#1d1d1b; --suave:#6b6a66; --borde:#dddbd5; --acento:#2f6f5e;
          --acento-texto:#fff; --ok:#2e7d32; --ok-texto:#fff; --ya:#f2a900; --ya-texto:#2b1d00; --mal:#c62828;
          --mal-texto:#fff; }
  @media (prefers-color-scheme: dark) {
    :root { --fondo:#171716; --panel:#222220; --texto:#ecebe7; --suave:#a3a19b; --borde:#3a3936; --acento:#5fae97;
            --acento-texto:#0f1a17; }
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--fondo); color:var(--texto); font:17px/1.35 system-ui, sans-serif;
         display:flex; flex-direction:column; -webkit-tap-highlight-color:transparent; }
  [hidden] { display:none !important; }
  header { display:flex; align-items:center; gap:.75rem; padding:.6rem 1rem; background:var(--panel);
           border-bottom:1px solid var(--borde); }
  header a { color:inherit; text-decoration:none; font-weight:600; }
  header .titulo { font-weight:700; margin-right:auto; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  header .suave { color:var(--suave); font-size:.9rem; }
  main { flex:1; display:flex; flex-direction:column; gap:.75rem; padding:.75rem 1rem 1rem; max-width:560px;
         width:100%; margin:0 auto; min-height:0; }
  label.campo { font-size:.9rem; color:var(--suave); margin:.25rem 0 -.4rem; }
  select, input, textarea { font:inherit; width:100%; padding:.8rem; border:1px solid var(--borde); border-radius:12px;
                            background:var(--panel); color:inherit; }
  button { font:inherit; font-weight:600; border:0; border-radius:14px; cursor:pointer; padding:1rem;
           background:var(--panel); color:var(--texto); border:1px solid var(--borde); }
  button.principal { background:var(--acento); color:var(--acento-texto); border-color:transparent; font-size:1.2rem; }
  .modos { display:grid; gap:.6rem; }
  .modos button { text-align:left; font-size:1.25rem; display:flex; justify-content:space-between; align-items:center; }
  .modos button[aria-pressed=true] { outline:3px solid var(--acento); outline-offset:-3px; }
  .modos .chico { font-size:.95rem; font-weight:500; color:var(--suave); }
  .separa { border-top:1px solid var(--borde); margin:.25rem 0; }
  select.grande { font-size:1.25rem; font-weight:600; padding:1rem; }
  button.escanear { display:flex; align-items:center; justify-content:center; gap:.6rem; min-height:5.5rem;
                    font-size:1.5rem; margin-top:.5rem; }
  .pista { color:var(--suave); font-size:.9rem; margin:0; }
  .pista a { color:var(--acento); }
  .tarea { border-top:1px solid var(--borde); padding:.6rem 0; display:flex; gap:.75rem; align-items:flex-start; }
  .tarea .texto { flex:1; }
  .tarea .meta { color:var(--suave); font-size:.9rem; }
  .tarea button.avanzar { flex:none; min-width:3.5rem; min-height:3.5rem; padding:0; font-size:1.5rem; border-radius:50%;
                          border:3px solid var(--acento); color:var(--acento); background:transparent; }
  .tarea button.avanzar:disabled { opacity:.4; }
  .barra { display:flex; align-items:center; gap:.5rem; }
  .barra .nombre { font-size:1.3rem; font-weight:700; margin-right:auto; }
  .barra .cuenta { font-size:1.1rem; font-variant-numeric:tabular-nums; }
  .barra button, .barra .boton-chico { padding:.5rem .8rem; }
  .boton-chico { border:1px solid var(--borde); border-radius:14px; background:var(--panel); color:var(--texto);
                 font-weight:600; text-decoration:none; }
  .punto { border-top:1px solid var(--borde); padding:.6rem 0; display:grid; gap:.5rem; }
  .fila-punto { display:flex; align-items:center; gap:.75rem; justify-content:space-between; }
  .okmal { display:flex; gap:.4rem; }
  .okmal button { padding:.6rem 1rem; min-width:4.2rem; }
  .okmal button[data-v="1"][aria-pressed=true] { background:var(--ok); color:var(--ok-texto); border-color:transparent; }
  .okmal button[data-v="0"][aria-pressed=true] { background:var(--mal); color:var(--mal-texto); border-color:transparent; }
  .fotos { display:flex; gap:.4rem; flex-wrap:wrap; }
  label.check { display:flex; gap:.5rem; align-items:center; font-weight:600; }
  label.check input { width:auto; }
  .contador.chico button { padding:.5rem .9rem; }
  .fotos img { width:5rem; height:5rem; object-fit:cover; border-radius:8px; border:1px solid var(--borde); }
  .camara { position:relative; background:#111; border-radius:14px; overflow:hidden; height:28vh; min-height:140px;
            flex:none; }
  .camara video { width:100%; height:100%; object-fit:cover; display:block; }
  .camara .marco { position:absolute; inset:18% 22%; border:3px solid rgba(255,255,255,.85); border-radius:12px; }
  .camara p { position:absolute; left:0; right:0; bottom:.4rem; margin:0; text-align:center; color:#eee;
              font-size:.85rem; text-shadow:0 1px 2px #000; padding:0 .5rem; }
  .aviso { flex:1; min-height:9rem; border-radius:16px; padding:1rem; display:flex; flex-direction:column;
           justify-content:center; text-align:center; gap:.2rem; background:var(--panel); border:1px solid var(--borde); }
  .aviso .k { font-size:1.25rem; font-weight:700; }
  .aviso .n { font-size:3.4rem; font-weight:800; line-height:1.05; font-variant-numeric:tabular-nums; }
  .aviso .s { font-size:1.05rem; }
  .aviso.ok { background:var(--ok); color:var(--ok-texto); border-color:transparent; }
  .aviso.ya { background:var(--ya); color:var(--ya-texto); border-color:transparent; }
  .aviso.mal { background:var(--mal); color:var(--mal-texto); border-color:transparent; }
  .aviso.pulso { animation:pulso .35s ease-out; }
  @keyframes pulso { from { transform:scale(.97); } to { transform:none; } }
  .escribir { display:flex; gap:.5rem; }
  .escribir input { text-transform:uppercase; }
  .escribir button { flex:none; }
  .deshacer { font-size:1.15rem; }
  details { background:var(--panel); border:1px solid var(--borde); border-radius:12px; padding:.6rem .8rem; }
  details summary { font-weight:600; cursor:pointer; }
  ul.lista { list-style:none; margin:.5rem 0 0; padding:0; }
  ul.lista li { display:flex; gap:.5rem; align-items:center; padding:.4rem 0; border-top:1px solid var(--borde);
                font-size:.95rem; }
  ul.lista li span { flex:1; }
  ul.lista li button { padding:.35rem .6rem; font-size:.85rem; border-radius:8px; }
  ul.lista .deshecha { text-decoration:line-through; color:var(--suave); }
  .tarjeta { background:var(--panel); border:1px solid var(--borde); border-radius:16px; padding:1rem; display:grid;
             gap:.6rem; }
  .tarjeta h2 { margin:0; font-size:1.35rem; }
  .pct { font-size:2.4rem; font-weight:800; }
  .barrita { height:10px; border-radius:99px; background:var(--borde); overflow:hidden; }
  .barrita i { display:block; height:100%; background:var(--acento); }
  .contador { display:flex; align-items:center; justify-content:center; gap:1rem; }
  .contador button { width:3.5rem; height:3.5rem; font-size:1.8rem; padding:0; }
  .contador output { font-size:2.4rem; font-weight:800; min-width:3ch; text-align:center; }
  .faltan { color:var(--mal); font-weight:600; }
  .suave { color:var(--suave); }
  .error { color:var(--mal); font-weight:600; }
</style>
</head>
<body>
<header>
  {% include 'menu.html' %}
  <span class="titulo" id="titulo">Mi puesto</span>
</header>

<main>
  <!-- elegir qué se hace en este puesto -->
  <section id="elegir" class="modos">
    <label class="campo" for="selModo">Proceso</label>
    <select id="selModo" class="grande"></select>
    <div class="modos" id="campoUbicacion">
      <label class="campo" for="selUbicacion">Ubicación <span class="chico">(dónde quedan las piezas)</span></label>
      <select id="selUbicacion" class="grande"></select>
    </div>
    <p class="pista" id="sinUbicaciones" hidden></p>
    <div class="modos" id="campoCarga" hidden>
      <label class="campo" for="selCarga">Carga</label>
      <select id="selCarga" class="grande"></select>
    </div>
    <p class="error" id="errElegir" hidden></p>
    <button type="button" class="principal escanear" id="btnEmpezar">
      <svg width="30" height="30" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7V5h3M17 5h3v2M20 17v2h-3M7 19H4v-2"/><path d="M8 9v6M11 9v6M14 9v6M17 9v6"/></svg>
      Escanear</button>
  </section>

  <!-- escaneando -->
  <section id="trabajo" hidden style="display:flex;flex-direction:column;gap:.75rem;flex:1;min-height:0">
    <div class="barra">
      <span class="nombre" id="modoNombre"></span>
      <span class="cuenta" id="cuenta"></span>
      <a class="boton-chico" id="verLista" hidden>Lista</a>
      <a class="boton-chico" id="ver3D" hidden>3D</a>
      <button type="button" id="btnCerrarCarga" hidden>Cerrar la carga</button>
      <button type="button" id="btnCambiar">Cambiar</button>
    </div>
    <div class="camara" id="camara">
      <video id="video" playsinline muted></video>
      <div class="marco"></div>
      <p id="camMsg">Apuntá a la etiqueta</p>
    </div>
    <div class="aviso" id="aviso" role="status" aria-live="assertive">
      <div class="k" id="a1">Listo para escanear</div>
      <div class="n" id="a2"></div>
      <div class="s" id="a3"></div>
      <div class="s" id="a4"></div>
    </div>
    <div class="tarjeta" id="tarjeta" hidden></div>
    <button type="button" id="btnAnotar" hidden>✎ Agregar anotación</button>
    <div class="tarjeta" id="formAnotar" hidden>
      <h2 id="anotTitulo">Anotación</h2>
      <textarea id="anotTexto" rows="3" maxlength="2000" placeholder="¿Qué pasó? ¿Qué hay que saber?" aria-label="Anotación"></textarea>
      <label class="campo" for="anotFotos">Fotos (opcional)</label>
      <input type="file" id="anotFotos" accept="image/*" capture="environment" multiple>
      <label class="check" id="anotTareaFila"><input type="checkbox" id="anotTarea"> Hay que arreglarlo (crea una tarea)</label>
      <p class="error" id="errAnot" hidden></p>
      <button type="button" class="principal" id="btnGuardarAnot">Guardar la anotación</button>
      <button type="button" id="btnCancelarAnot">Cancelar</button>
    </div>
    <div id="pedirProyecto" hidden>
      <label class="campo" for="selProyecto">Proyecto de los números de mecanizado</label>
      <select id="selProyecto"></select>
    </div>
    <form class="escribir" id="formEscribir" autocomplete="off">
      <input id="escrito" placeholder="Código o número" aria-label="Código de la etiqueta o número de mecanizado" enterkeyhint="go">
      <button type="submit">OK</button>
    </form>
    <button type="button" class="deshacer" id="btnDeshacer" hidden></button>
    <details id="ultimas" hidden><summary>Últimas lecturas</summary><ul class="lista" id="listaUltimas"></ul></details>
    <details id="faltanCarga" hidden open><summary id="faltanTitulo">Faltan</summary><ul class="lista" id="listaFaltan"></ul></details>
    <a id="verCarga" hidden class="suave" href="#">Ver la carga y marcar "Salió a obra"</a>
  </section>
</main>

<script>
(() => {
const C = {{ config|safe }};
const $ = id => document.getElementById(id);
const guardado = (() => { try { return JSON.parse(localStorage.getItem('puesto.eleccion') || '{}'); } catch (e) { return {}; } })();
const q = new URLSearchParams(location.search);
// el proyecto no se elige: lo dice cada etiqueta. Se recuerda el de la última pieza leída, para los números de
// mecanizado (que no dicen de qué proyecto son); si todavía no hay ninguno, se pide ahí mismo.
let estado = {
  proyecto: q.get('p') ? +q.get('p') : null,
  modo: q.get('modo') || (q.get('c') ? 'carga' : guardado.modo),
  etapa: guardado.etapa,
  carga: q.get('c') ? +q.get('c') : guardado.carga,
  ubicacion: guardado.ubicacion || null,
};
let pendiente = '';               // lo leído que esperaba el proyecto
let ultimas = [], muebleActual = null, cargaActual = null;

/* ---------- elegir ---------- */
function opciones(sel, items, valor, vacio){
  sel.innerHTML = (vacio ? `<option value="">${vacio}</option>` : '') +
    items.map(i => `<option value="${i.id}">${esc(i.nombre)}</option>`).join('');
  if (valor && items.some(i => i.id === valor)) sel.value = valor;
}
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
opciones($('selProyecto'), C.proyectos, estado.proyecto, 'Elegí el proyecto');
// la carga: una de las que se están cargando o "Nueva": la crea el primer bulto escaneado (lleva solo lo que se escanee)
function opcionesCarga(){
  opciones($('selCarga'), C.cargas, estado.carga, null);
  $('selCarga').insertAdjacentHTML('afterbegin', '<option value="nueva">Nueva carga (se crea al escanear)</option>');
  if (!C.cargas.some(c => c.id === estado.carga)) $('selCarga').value = 'nueva';
}
opcionesCarga();
opciones($('selUbicacion'), C.ubicaciones, estado.ubicacion, 'No cambiar');
// los procesos prendidos del taller, en orden (Procesos): por pieza → modo etapa; por mueble (y Armado) → modo mueble;
// los fijos de después del armado tienen su modo. "Tareas" va aparte, al final.
const MODO_DE_TIPO = {control: 'control', embalaje: 'fin', carga: 'carga', instalacion: 'instalar'};
const modoDe = p => p.tipo === 'pieza' && !p.por_mueble ? 'etapa' : MODO_DE_TIPO[p.tipo] || 'mueble';
const valorDe = p => ['etapa', 'mueble'].includes(modoDe(p)) ? `${modoDe(p)}:${p.id}` : modoDe(p);
const proceso = id => C.procesos.find(p => p.id === id);
const fijo = tipo => C.procesos.find(p => p.tipo === tipo);
// el proceso al que van las anotaciones y el nombre en la barra
function procesoActual(){
  if (['etapa', 'mueble'].includes(estado.modo)) return proceso(estado.etapa);
  const tipo = Object.keys(MODO_DE_TIPO).find(t => MODO_DE_TIPO[t] === estado.modo);
  return tipo ? fijo(tipo) : null;
}
const MODOS = {tareas: 'Tareas'};
$('selModo').innerHTML = '<option value="">Elegí el proceso</option>'
  + C.procesos.map(p => `<option value="${valorDe(p)}">${esc(p.nombre)}${p.tipo === 'pieza' && p.por_mueble ? ' (por mueble)' : ''}</option>`).join('')
  + (C.tareas ? `<option value="tareas">Tareas (lo que falta hacer)</option>` : '');
const valorModo = () => ['etapa', 'mueble'].includes(estado.modo) ? `${estado.modo}:${estado.etapa}` : estado.modo || '';
$('selModo').value = valorModo();
if ($('selModo').value !== valorModo()) $('selModo').value = '';
// la ubicación vale para las piezas y los bultos que quedan en el taller: no al cargar, entregar ni en tareas
function camposSegunModo(){
  const enTaller = ['etapa', 'mueble', 'fin'].includes(estado.modo) || !estado.modo;
  $('campoUbicacion').hidden = !enTaller || !C.ubicaciones.length;
  $('sinUbicaciones').hidden = !enTaller || C.ubicaciones.length > 0 || !C.urlProcesos;
  $('sinUbicaciones').innerHTML = `Para anotar dónde quedan las piezas, cargá las ubicaciones del taller en <a href="${C.urlProcesos}">Procesos</a>.`;
  $('campoCarga').hidden = estado.modo !== 'carga';
}
$('selModo').onchange = () => {
  const v = $('selModo').value, [modo, id] = v.split(':');
  estado.modo = modo || null;
  if (id) estado.etapa = +id;
  camposSegunModo(); $('errElegir').hidden = true;
};
camposSegunModo();
const ubicacionElegida = () => C.ubicaciones.find(u => u.id === estado.ubicacion);
$('selProyecto').onchange = () => {
  estado.proyecto = +$('selProyecto').value || null;
  if (estado.proyecto && pendiente){ const t = pendiente; pendiente = ''; ultimoTexto = ''; leido(t); }
};
function usarProyecto(p){                // el de la última pieza leída, para los números de mecanizado
  if (!p) return;
  estado.proyecto = p.id; $('selProyecto').value = p.id; $('pedirProyecto').hidden = true;
  links();
}
// Lista y 3D: el avance del proceso que se está trabajando en el proyecto de la última lectura (qué muebles, o
// piezas, ya lo cumplieron), para mirar; no es el visor de armado
function links(){
  const p = procesoActual(), ver = !!p && !!estado.proyecto;
  $('verLista').hidden = $('ver3D').hidden = !ver;
  if (ver){ $('verLista').href = `${C.entrega.replace('{id}', estado.proyecto)}?proceso=${p.id}`;
            $('ver3D').href = `${C.visor}?p=${estado.proyecto}&avance=${p.id}`
              + (estado.modo === 'carga' && estado.carga !== 'nueva' ? `&carga=${estado.carga}` : ''); }
}
function faltaProyecto(d, txt){
  if (!d.falta_proyecto) return false;
  pendiente = txt; $('pedirProyecto').hidden = false;
  mostrar('mal', 'Falta el proyecto', '', d.error);
  return true;
}

function validarEleccion(){
  estado.carga = $('selCarga').value === 'nueva' ? 'nueva' : +$('selCarga').value || 'nueva';
  estado.ubicacion = ['etapa', 'mueble', 'fin'].includes(estado.modo) ? (+$('selUbicacion').value || null) : null;
  if (!$('selModo').value || !estado.modo) return 'Elegí el proceso.';
  return null;
}
$('btnEmpezar').onclick = () => {
  const err = validarEleccion();
  if (err){ $('errElegir').textContent = err; $('errElegir').hidden = false; return; }
  try { localStorage.setItem('puesto.eleccion', JSON.stringify({modo: estado.modo, etapa: estado.etapa,
    carga: estado.carga, ubicacion: estado.ubicacion})); } catch (e) {}
  activarSonido(); empezar();
};
$('btnCambiar').onclick = () => { detenerCamara(); $('trabajo').hidden = true; $('elegir').hidden = false;
  $('titulo').textContent = 'Mi puesto'; };

/* ---------- sonido, vibración y pantalla prendida ---------- */
let audio = null;
function activarSonido(){
  try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); audio.resume(); } catch (e) {}
}
function tono(frec, ms, cuando = 0, forma = 'sine'){
  if (!audio) return;
  const o = audio.createOscillator(), g = audio.createGain(), t = audio.currentTime + cuando;
  o.type = forma; o.frequency.value = frec; o.connect(g); g.connect(audio.destination);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.4, t + .01);
  g.gain.exponentialRampToValueAtTime(.0001, t + ms / 1000); o.start(t); o.stop(t + ms / 1000 + .02);
}
const SONIDOS = {
  ok:  () => { tono(1320, 130); vibrar([70]); },
  ya:  () => { tono(660, 120); tono(660, 120, .18); vibrar([60, 80, 60]); },
  mal: () => { tono(200, 450, 0, 'square'); vibrar([350]); },
};
function vibrar(p){ try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} }
let wake = null;
async function pantallaPrendida(){
  try { if ('wakeLock' in navigator && !wake) { wake = await navigator.wakeLock.request('screen');
    wake.addEventListener('release', () => { wake = null; }); } } catch (e) {}
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && !$('trabajo').hidden){ pantallaPrendida(); if (!flujo) abrirCamara(); }
});

/* ---------- empezar ---------- */
function empezar(){
  $('elegir').hidden = true; $('trabajo').hidden = false;
  const carga = C.cargas.find(c => c.id === estado.carga), p = procesoActual();
  const u = ubicacionElegida();
  $('modoNombre').textContent = (p ? p.nombre : MODOS[estado.modo] || '') + (u ? ` · ${u.nombre}` : '');
  $('titulo').textContent = estado.modo === 'carga' ? (carga ? carga.nombre : '') : 'Mi puesto';
  sinAnotar();
  $('pedirProyecto').hidden = true; pendiente = '';
  $('cuenta').textContent = ''; $('tarjeta').hidden = true; $('aviso').hidden = false;
  $('faltanCarga').hidden = $('verCarga').hidden = estado.modo !== 'carga';
  ultimas = []; dibujarUltimas();
  mostrar('', 'Listo para escanear', '', estado.modo === 'etapa' ? 'Pieza tras pieza' : estado.modo === 'fin'
    ? 'Escaneá la etiqueta del mueble' : estado.modo === 'tareas' ? 'Escaneá una pieza o un mueble'
    : estado.modo === 'mueble' ? 'Escaneá una pieza o el mueble' : estado.modo === 'control' ? 'Escaneá el mueble armado'
    : estado.modo === 'instalar' ? 'Escaneá el mueble o un bulto' : 'Escaneá cada bulto');
  if (carga) usarProyecto({id: carga.proyecto});
  links();
  $('btnCerrarCarga').hidden = true;
  if (estado.modo === 'carga') usarCarga(estado.carga);
  if (estado.modo === 'fin' && q.get('m') && estado.proyecto)            // desde el proyecto: ver ese mueble
    pedir('GET', `mueble?proyecto=${estado.proyecto}&mueble=${encodeURIComponent(q.get('m'))}`)
      .then(r => r.ok ? tarjetaMueble(r.datos) : null);
  pantallaPrendida(); abrirCamara();
}

/* ---------- lecturas ---------- */
let ultimoTexto = '', ultimoMomento = 0, ocupado = false;
async function leido(txt){
  txt = String(txt).trim();
  const ahora = Date.now();
  if (!txt || ocupado || (txt === ultimoTexto && ahora - ultimoMomento < 3000)) return;    // la misma etiqueta frente a la cámara
  ultimoTexto = txt; ultimoMomento = ahora; ocupado = true;
  if ($('tarjeta').hidden) mostrar('', 'Leyendo…', '', '');
  sinAnotar();
  try {
    if (estado.modo === 'etapa') await marcar(txt);
    else if (estado.modo === 'fin') await leerMueble(txt);
    else if (estado.modo === 'tareas') await leerTareas(txt);
    else if (estado.modo === 'mueble') await armarMueble(txt);
    else if (estado.modo === 'control') await leerControl(txt);
    else if (estado.modo === 'instalar') await leerInstalacion(txt);
    else await leerBulto(txt);
  } finally { ocupado = false; }
}

async function pedir(metodo, ruta, cuerpo){
  try {
    const r = await fetch(C.api + ruta, {method: metodo, credentials: 'same-origin',
      headers: cuerpo ? {'Content-Type': 'application/json', 'X-CSRFToken': C.csrf} : {},
      body: cuerpo ? JSON.stringify(cuerpo) : undefined});
    let datos = null; try { datos = await r.json(); } catch (e) {}
    if (r.status === 403 && !datos) datos = {error: 'Se cerró la sesión. Volvé a entrar.'};
    return {ok: r.ok, datos: datos || {error: 'No se pudo leer la respuesta.'}};
  } catch (e) { return {ok: false, datos: {error: 'Sin conexión. Probá de nuevo.'}}; }
}

function mostrar(clase, k, n, s, s2){
  const a = $('aviso');
  a.hidden = false; $('tarjeta').hidden = true;     // el aviso reemplaza la tarjeta de la lectura anterior
  a.className = 'aviso' + (clase ? ' ' + clase : '');
  void a.offsetWidth; if (clase) a.classList.add('pulso');
  $('a1').textContent = k || ''; $('a2').textContent = n || ''; $('a3').textContent = s || ''; $('a4').textContent = s2 || '';
  if (clase) SONIDOS[clase]();
}
const numero = p => p.num ? p.num : 's/n';
const copia = p => p.de > 1 ? ` (${p.copia} de ${p.de})` : '';

async function marcar(txt){
  const r = await pedir('POST', 'marcar', {texto: txt, etapa: estado.etapa, proyecto: estado.proyecto,
                                           ubicacion: estado.ubicacion});
  const d = r.datos;
  if (r.ok && faltaProyecto(d, txt)) return;
  if (!r.ok || d.resultado === 'error') return mostrar('mal', d.error || 'No se pudo marcar', '', d.mueble ? `Mueble: ${d.mueble}` : '');
  usarProyecto(d.proyecto);
  const p = d.pieza, etapa = d.etapa.toLowerCase(), lugar = d.ubicacion ? ` · ahora en ${d.ubicacion}` : '';
  const detalle = `${p.nombre}${copia(p)} · ${p.mueble}`;
  const enMueble = `${p.mueble}: ${d.mueble.hechas} de ${d.mueble.piezas} · ${d.proyecto.nombre}`;
  if (d.resultado === 'ya'){
    mostrar('ya', `Ya estaba ${etapa}${lugar}`, numero(p), `${d.ya.por || '—'}, ${cuandoCorto(d.ya.cuando)}`, detalle);
  } else {
    mostrar('ok', `${d.etapa}${lugar}`, numero(p), detalle, enMueble);
    sumarUltima(d, p);
  }
  $('cuenta').textContent = `${d.total.hechas} / ${d.total.piezas}`;
  anotable({proyecto: d.proyecto.id, mueble: p.mueble, panel: p.panel, nombre: `${numero(p)} ${p.nombre}`});
}

function sumarUltima(d, p){
  ultimas.unshift({marca: d.marca, corto: numero(p), texto: `${numero(p)} ${p.nombre}${copia(p)} · ${p.mueble}`});
  ultimas = ultimas.slice(0, 10); dibujarUltimas();
}
function dibujarUltimas(){
  const vigente = ultimas.find(u => !u.deshecha);
  $('btnDeshacer').hidden = !vigente;
  if (vigente) $('btnDeshacer').textContent = '↶ Deshacer ' + vigente.corto;
  $('ultimas').hidden = !ultimas.length;
  $('listaUltimas').innerHTML = ultimas.map((u, i) => `<li><span class="${u.deshecha ? 'deshecha' : ''}">${esc(u.texto)}</span>
    ${u.deshecha ? '' : `<button type="button" data-i="${i}">Deshacer</button>`}</li>`).join('');
  $('listaUltimas').querySelectorAll('button').forEach(b => b.onclick = () => deshacer(ultimas[+b.dataset.i]));
}
async function deshacer(u){
  if (!u) return;
  if (estado.modo === 'carga'){
    const r = await pedir('POST', `cargas/${estado.carga}/deshacer`, {bulto: u.bulto});
    if (!r.ok) return mostrar('mal', r.datos.error);
    u.deshecha = true; dibujarUltimas(); dibujarCarga(r.datos.carga);
    return mostrar('', 'Deshecho', '', u.texto);
  }
  const r = await pedir('POST', 'deshacer', u.marcas ? {marcas: u.marcas} : {marca: u.marca});
  if (!r.ok) return mostrar('mal', r.datos.error);
  u.deshecha = true; dibujarUltimas();
  mostrar('', 'Deshecho', '', u.texto, 'Ya no figura en esta etapa');
  ultimoTexto = '';               // se puede volver a escanear enseguida
}
$('btnDeshacer').onclick = () => deshacer(ultimas.find(u => !u.deshecha));

function cuandoCorto(t){
  if (!t) return '';
  const [f, h] = t.split(' '), hoy = new Date();
  const iso = `${hoy.getFullYear()}-${String(hoy.getMonth() + 1).padStart(2, '0')}-${String(hoy.getDate()).padStart(2, '0')}`;
  return f === iso ? `hoy ${h}` : `${f.split('-').reverse().slice(0, 2).join('/')} ${h}`;
}

/* ---------- embalaje: escanear el mueble lo deja embalado con 1 bulto; − y + corrigen ---------- */
async function leerMueble(txt){
  const r = await pedir('POST', 'embalar', {texto: txt, proyecto: estado.proyecto, ubicacion: estado.ubicacion});
  if (r.ok && faltaProyecto(r.datos, txt)){ $('tarjeta').hidden = true; return; }
  if (!r.ok || r.datos.resultado === 'error'){ $('tarjeta').hidden = true; return mostrar('mal', r.datos.error); }
  usarProyecto(r.datos.proyecto);
  (r.datos.resultado === 'ok' ? SONIDOS.ok : SONIDOS.ya)();
  tarjetaMueble(r.datos);
}
function tarjetaMueble(d){
  muebleActual = d;
  $('aviso').hidden = true; $('tarjeta').hidden = false;
  const t = $('tarjeta'), fin = d.fin;
  const cargado = fin && fin.lista.some(b => b.estado !== 'embalado');
  t.innerHTML = `<h2>${esc(d.mueble)}</h2>
    <div class="suave">${esc(d.proyecto.nombre)} · ${d.piezas} piezas · ${d.pct}%</div>
    ${fijo('control') ? `<div>${resumenControl(d.control)}</div>` : ''}
    ${fin ? `<p><b>${d.resultado === 'ya' ? 'Ya estaba embalado' : d.resultado === 'ok' ? 'Embalado ✓' : 'Embalado'}</b>
        · ${esc(fin.por || '')}, ${cuandoCorto(fin.cuando)}</p>
      ${fin.faltantes.length ? `<p class="suave">Faltaban ${fin.faltantes.length} pieza${fin.faltantes.length > 1 ? 's' : ''} en el armado.</p>` : ''}
      <label class="campo">Bultos</label>
      <div class="contador chico"><button type="button" id="menos" aria-label="Uno menos"${cargado ? ' disabled' : ''}>−</button>
        <output id="bultos">${fin.bultos}</output>
        <button type="button" id="mas" aria-label="Uno más"${cargado ? ' disabled' : ''}>+</button></div>
      ${cargado ? '<p class="suave">Ya se cargó algún bulto: la cantidad no se cambia.</p>' : ''}
      <ul class="lista">${fin.lista.map(b => `<li><span>Bulto ${b.numero} de ${fin.bultos}</span><span class="suave">${esc(b.estado_texto)}</span></li>`).join('')}</ul>
      <p class="error" id="errFin" hidden></p>
      <button type="button" class="principal" id="btnImprimir">Imprimir etiquetas de los bultos</button>
      ${C.gestiona ? '<button type="button" id="btnReabrir">Deshacer el embalaje</button>' : ''}`
    : '<p class="suave">Todavía sin embalar.</p>'}
    <button type="button" id="btnOtro">Escanear otro mueble</button>`;
  botonOtro(t, 'Escaneá la etiqueta del mueble');
  anotable({proyecto: d.proyecto.id, mueble: d.mueble, nombre: d.mueble});
  if (!fin) return;
  $('btnImprimir').onclick = () => imprimir(d, fin.bultos);
  const cambiar = async n => {
    const r = await pedir('POST', 'bultos', {proyecto: d.proyecto.id, mueble: d.mueble, bultos: n});
    if (!r.ok){ $('errFin').textContent = r.datos.error; $('errFin').hidden = false; SONIDOS.mal(); return; }
    tarjetaMueble({...r.datos, resultado: ''});
  };
  if (!cargado){
    $('menos').onclick = () => fin.bultos > 1 && cambiar(fin.bultos - 1);
    $('mas').onclick = () => fin.bultos < d.max_bultos && cambiar(fin.bultos + 1);
  }
  if ($('btnReabrir')) $('btnReabrir').onclick = async () => {
    if (!confirm(`¿Deshacer el embalaje de ${d.mueble}? Sus bultos dejan de valer.`)) return;
    const r = await pedir('POST', 'reabrir', {proyecto: d.proyecto.id, mueble: d.mueble});
    if (!r.ok) return alert(r.datos.error);
    const r2 = await pedir('GET', `mueble?proyecto=${d.proyecto.id}&mueble=${encodeURIComponent(d.mueble)}`);
    if (r2.ok) tarjetaMueble(r2.datos);
  };
}
function imprimir(d, bultos){
  const qs = new URLSearchParams({proyecto: d.proyecto.id, m: d.mueble, bultos});
  window.open(C.pdf + '?' + qs, '_blank', 'noopener');
}

/* ---------- tareas: las que faltan de la pieza o el mueble leído, con ✓ para pasarlas al estado siguiente ---------- */
const SIGUIENTE = {pendiente: 'en proceso', 'en proceso': 'hecho', hecho: 'instalado'};
const NOMBRE_ESTADO = {pendiente: 'Pendiente', 'en proceso': 'En proceso', hecho: 'Hecha', instalado: 'Instalada'};
async function leerTareas(txt){
  const r = await pedir('POST', 'tareas', {texto: txt, proyecto: estado.proyecto});
  if (r.ok && faltaProyecto(r.datos, txt)){ $('tarjeta').hidden = true; return; }
  if (!r.ok || r.datos.resultado === 'error'){ $('tarjeta').hidden = true; return mostrar('mal', r.datos.error); }
  usarProyecto(r.datos.proyecto);
  const d = r.datos;
  if (!d.tareas.length){ $('tarjeta').hidden = true;
    return mostrar('ok', 'Sin tareas', d.pieza ? numero(d.pieza) : '', d.pieza ? `${d.pieza.nombre} · ${d.mueble}` : d.mueble,
                   'No falta nada por hacer o instalar'); }
  SONIDOS.ya(); tarjetaTareas(d);
}
// las tareas de una tarjeta (Tareas o Instalar): texto, estado, para quién, vencimiento y ✓ para pasar al siguiente
const hoyISO = () => new Date().toISOString().slice(0, 10);
const metaTarea = x => [NOMBRE_ESTADO[x.estado], x.asignado ? `para ${x.asignado}` : '',
  x.limite ? `${x.limite < hoyISO() && ['pendiente', 'en proceso'].includes(x.estado) ? 'venció' : 'vence'} ${x.limite.split('-').reverse().slice(0, 2).join('/')}` : '']
  .filter(Boolean).join(' · ');
const htmlTareas = tareas => tareas.map((x, i) => `<div class="tarea"><div class="texto">${esc(x.texto)}<div class="meta" data-meta="${i}">${esc(metaTarea(x))}</div></div>
  <button type="button" class="avanzar" data-i="${i}" aria-label="Pasar a ${esc(NOMBRE_ESTADO[SIGUIENTE[x.estado]])}">✓</button></div>`).join('');
function conectarTareas(t, tareas){
  t.querySelectorAll('button.avanzar').forEach(b => b.onclick = async () => {
    const x = tareas[+b.dataset.i];
    b.disabled = true;
    try {
      const r = await fetch(C.tareas + x.id, {method: 'PATCH', credentials: 'same-origin',
        headers: {'Content-Type': 'application/json', 'X-CSRFToken': C.csrf}, body: JSON.stringify({estado: SIGUIENTE[x.estado]})});
      const nuevo = await r.json();
      if (!r.ok) throw new Error(nuevo.error || 'No se pudo cambiar');
      tareas[+b.dataset.i] = nuevo; SONIDOS.ok();
      t.querySelector(`[data-meta="${b.dataset.i}"]`).textContent = metaTarea(nuevo);
      b.disabled = !SIGUIENTE[nuevo.estado];
      if (SIGUIENTE[nuevo.estado]) b.setAttribute('aria-label', `Pasar a ${NOMBRE_ESTADO[SIGUIENTE[nuevo.estado]]}`);
    } catch (e) { alert(e.message); b.disabled = false; SONIDOS.mal(); }
  });
}
function botonOtro(t, texto){
  $('btnOtro').onclick = () => { t.hidden = true; $('aviso').hidden = false; ultimoTexto = ''; sinAnotar();
    mostrar('', 'Listo para escanear', '', texto); };
}
function tarjetaTareas(d){
  $('aviso').hidden = true; $('tarjeta').hidden = false;
  const t = $('tarjeta');
  t.innerHTML = `<h2>${d.pieza ? `${esc(numero(d.pieza))} ${esc(d.pieza.nombre)}` : esc(d.mueble)}</h2>
    <div class="suave">${d.pieza ? `${esc(d.mueble)} · ` : ''}${esc(d.proyecto.nombre)} · ${d.tareas.length} tarea${d.tareas.length > 1 ? 's' : ''} sin instalar</div>
    ${htmlTareas(d.tareas)}
    <button type="button" id="btnOtro">Escanear otra</button>`;
  conectarTareas(t, d.tareas);
  botonOtro(t, 'Escaneá una pieza o un mueble');
  anotable({proyecto: d.proyecto.id, mueble: d.mueble, panel: d.pieza ? d.pieza.panel : '',
            nombre: d.pieza ? `${numero(d.pieza)} ${d.pieza.nombre}` : d.mueble});
}

/* ---------- fotos: del celular (cámara) a la API, de a una ---------- */
async function subirFotos(url, archivos){
  let mal = 0;
  for (const f of archivos){
    try {
      const r = await fetch(url, {method: 'POST', credentials: 'same-origin',
        headers: {'Content-Type': f.type || 'image/jpeg', 'X-CSRFToken': C.csrf}, body: f});
      if (!r.ok) mal++;
    } catch (e) { mal++; }
  }
  return mal;
}
const campoFotos = (id, texto) => `<label class="campo" for="${id}">${texto}</label>
  <input type="file" id="${id}" accept="image/*" capture="environment" multiple>`;

/* ---------- armado del mueble entero: cualquier etiqueta de una de sus piezas ---------- */
async function armarMueble(txt){
  const r = await pedir('POST', 'armar', {texto: txt, proyecto: estado.proyecto, ubicacion: estado.ubicacion,
                                          etapa: estado.etapa});
  const d = r.datos;
  if (r.ok && faltaProyecto(d, txt)){ $('tarjeta').hidden = true; return; }
  if (!r.ok || d.resultado === 'error'){ $('tarjeta').hidden = true; return mostrar('mal', d.error || 'No se pudo armar'); }
  usarProyecto(d.proyecto);
  if (d.marcas.length){
    ultimas.unshift({marcas: d.marcas, corto: d.mueble, texto: `${d.mueble}: ${d.etapa.toLowerCase()} (${d.nuevas} piezas)`});
    ultimas = ultimas.slice(0, 10); dibujarUltimas();
  }
  (d.resultado === 'ok' ? SONIDOS.ok : SONIDOS.ya)();
  $('aviso').hidden = true; $('tarjeta').hidden = false;
  const t = $('tarjeta');
  t.innerHTML = `<h2>${esc(d.mueble)}</h2>
    <div class="suave">${esc(d.proyecto.nombre)} · ${d.piezas} piezas</div>
    <p><b>${d.resultado === 'ok' ? `${esc(d.etapa)} ✓` : `Ya estaba: ${esc(d.etapa.toLowerCase())}`}</b>${d.nuevas && d.nuevas < d.piezas ? ` · ${d.nuevas} piezas que faltaban` : ''}
      ${d.ya ? ` · ${esc(d.ya.por || '—')}, ${cuandoCorto(d.ya.cuando)}` : ''}${d.ubicacion ? ` · queda en ${esc(d.ubicacion)}` : ''}</p>
    ${proceso(estado.etapa) && proceso(estado.etapa).tipo === 'armado' ? '<button type="button" class="principal" id="btnEtiquetaMueble">Imprimir la etiqueta del mueble</button>' : ''}
    <button type="button" id="btnOtro">Escanear otro mueble</button>`;
  if ($('btnEtiquetaMueble')) $('btnEtiquetaMueble').onclick = () => window.open(C.pdf + '?' + new URLSearchParams({proyecto: d.proyecto.id, m: d.mueble, bultos: 0}), '_blank', 'noopener');
  botonOtro(t, 'Escaneá una pieza o el mueble');
  anotable({proyecto: d.proyecto.id, mueble: d.mueble, nombre: d.mueble});
}

/* ---------- control de calidad: la lista del taller, Ok o Mal; cada Mal crea una tarea ---------- */
async function leerControl(txt){
  const r = await pedir('POST', 'control', {texto: txt, proyecto: estado.proyecto});
  const d = r.datos;
  if (r.ok && faltaProyecto(d, txt)){ $('tarjeta').hidden = true; return; }
  if (!r.ok || d.resultado === 'error'){ $('tarjeta').hidden = true; return mostrar('mal', d.error || 'No se pudo leer'); }
  usarProyecto(d.proyecto);
  (d.ultimo ? SONIDOS.ya : SONIDOS.ok)(); tarjetaControl(d);
  anotable({proyecto: d.proyecto.id, mueble: d.mueble, nombre: d.mueble});
}
const resumenControl = c => !c ? '<span class="faltan">Sin control de calidad</span>'
  : c.ok ? `Control ok ✓ <span class="suave">· ${esc(c.por || '—')}, ${cuandoCorto(c.cuando)}</span>`
  : `<span class="faltan">Control con observaciones: ${esc(c.mal.join(', '))}</span> <span class="suave">· ${esc(c.por || '—')}, ${cuandoCorto(c.cuando)}</span>`;
function tarjetaControl(d){
  $('aviso').hidden = true; $('tarjeta').hidden = false;
  const t = $('tarjeta'), resp = {};
  t.innerHTML = `<h2>${esc(d.mueble)}</h2>
    <div class="suave">${esc(d.proyecto.nombre)}</div>
    ${d.armado ? '' : `<p class="faltan">Todavía no está armado (${d.armadas} de ${d.piezas} piezas).</p>`}
    ${d.ultimo ? `<p><b>Ya tiene control.</b> Último: ${resumenControl(d.ultimo)}</p><p class="suave">Para repetirlo, marcá de nuevo cada punto.</p>` : ''}
    ${d.puntos.map(p => `<div class="punto" data-p="${p.id}">
      <div class="fila-punto"><b>${esc(p.nombre)}</b>
        <span class="okmal"><button type="button" data-v="1" aria-pressed="false">Ok</button><button type="button" data-v="0" aria-pressed="false">Mal</button></span></div>
      <div class="detalle" hidden><textarea rows="2" maxlength="1000" placeholder="¿Qué pasa?"></textarea>
        ${C.tareas ? campoFotos('foto' + p.id, 'Foto (opcional)') : ''}</div></div>`).join('')}
    <p class="error" id="errControl" hidden></p>
    <button type="button" class="principal" id="btnGuardarControl">Guardar el control</button>
    <button type="button" id="btnOtro">Escanear otro mueble</button>`;
  t.querySelectorAll('.punto').forEach(el => el.querySelectorAll('[data-v]').forEach(b => b.onclick = () => {
    resp[el.dataset.p] = b.dataset.v === '1';
    el.querySelectorAll('[data-v]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    el.querySelector('.detalle').hidden = resp[el.dataset.p];
  }));
  $('btnGuardarControl').onclick = async () => {
    const faltan = d.puntos.filter(p => !(p.id in resp));
    if (faltan.length){ $('errControl').textContent = `Falta revisar: ${faltan.map(p => p.nombre).join(', ')}.`;
      $('errControl').hidden = false; return; }
    const resultados = d.puntos.map(p => ({punto: p.id, ok: resp[p.id],
      nota: resp[p.id] ? '' : t.querySelector(`.punto[data-p="${p.id}"] textarea`).value.trim()}));
    $('btnGuardarControl').disabled = true;
    const r = await pedir('POST', 'control', {proyecto: d.proyecto.id, mueble: d.mueble, resultados});
    if (!r.ok){ $('errControl').textContent = r.datos.error; $('errControl').hidden = false;
      $('btnGuardarControl').disabled = false; SONIDOS.mal(); return; }
    // la foto de cada punto mal va a la tarea que se creó
    let fotosMal = 0;
    for (const x of r.datos.control.resultados){
      const input = $('foto' + x.punto);
      if (x.tarea && input && input.files.length) fotosMal += await subirFotos(C.tareas + x.tarea + '/fotos', input.files);
    }
    const c = r.datos.control;
    (c.ok ? SONIDOS.ok : SONIDOS.ya)();
    t.innerHTML = `<h2>${esc(d.mueble)}</h2><p>${resumenControl(c)}</p>
      ${r.datos.tareas.length ? `<p class="suave">Se ${r.datos.tareas.length > 1 ? `crearon ${r.datos.tareas.length} tareas` : 'creó una tarea'} del mueble. Se puede embalar igual.</p>` : ''}
      ${fotosMal ? `<p class="error">${fotosMal} foto${fotosMal > 1 ? 's' : ''} no se pudo subir.</p>` : ''}
      <button type="button" id="btnOtro">Escanear otro mueble</button>`;
    botonOtro(t, 'Escaneá el mueble armado');
  };
  botonOtro(t, 'Escaneá el mueble armado');
}

/* ---------- instalar en obra: escanear el mueble (o un bulto o una pieza) lo deja instalado ---------- */
async function leerInstalacion(txt){
  const r = await pedir('POST', 'instalar', {texto: txt, proyecto: estado.proyecto});
  const d = r.datos;
  if (r.ok && faltaProyecto(d, txt)){ $('tarjeta').hidden = true; return; }
  if (!r.ok || d.resultado === 'error'){ $('tarjeta').hidden = true; return mostrar('mal', d.error || 'No se pudo'); }
  usarProyecto(d.proyecto);
  (d.resultado === 'ok' ? SONIDOS.ok : SONIDOS.ya)(); tarjetaInstalacion(d);
}
function tarjetaInstalacion(d){
  $('aviso').hidden = true; $('tarjeta').hidden = false;
  const t = $('tarjeta'), i = d.instalacion, b = d.bultos;
  t.innerHTML = `<h2>${esc(d.mueble)}</h2>
    <div class="suave">${esc(d.proyecto.nombre)}${b.total ? ` · ${b.entregados} de ${b.total} bulto${b.total > 1 ? 's' : ''} entregado${b.entregados !== 1 ? 's' : ''}` : ''}</div>
    ${fijo('control') ? `<p>${resumenControl(d.control)}</p>` : ''}
    ${i ? `<p><b>${d.resultado === 'ya' ? 'Ya estaba instalado' : 'Instalado ✓'}</b> · ${esc(i.por || '—')}, ${cuandoCorto(i.cuando)}</p>
      ${i.nota ? `<p>${esc(i.nota)}</p>` : ''}
      ${i.fotos.length ? `<div class="fotos">${i.fotos.map(f => `<a href="${C.api}fotos-de-instalacion/${f}" target="_blank" rel="noopener"><img src="${C.api}fotos-de-instalacion/${f}" alt="Foto de la instalación"></a>`).join('')}</div>` : ''}`
      : '<p class="suave">Sin instalar.</p>'}
    ${d.tareas.length ? `<div class="suave">${d.tareas.length} tarea${d.tareas.length > 1 ? 's' : ''} sin instalar:</div>${htmlTareas(d.tareas)}` : ''}
    ${i && C.gestiona ? '<button type="button" id="btnDesinstalar">Deshacer la instalación</button>' : ''}
    <button type="button" id="btnOtro">Escanear otro mueble</button>`;
  conectarTareas(t, d.tareas);
  if ($('btnDesinstalar')) $('btnDesinstalar').onclick = async () => {
    if (!confirm(`¿Deshacer la instalación de ${d.mueble}?`)) return;
    const r = await pedir('POST', 'desinstalar', {proyecto: d.proyecto.id, mueble: d.mueble});
    if (!r.ok) return alert(r.datos.error);
    const r2 = await pedir('POST', 'instalacion', {proyecto: d.proyecto.id, mueble: d.mueble});
    if (r2.ok) tarjetaInstalacion({...r2.datos, resultado: ''});
  };
  botonOtro(t, 'Escaneá el mueble o un bulto');
  anotable({proyecto: d.proyecto.id, mueble: d.mueble, nombre: d.mueble});
}

/* ---------- anotaciones: una nota (y fotos) pegada a lo último que se leyó; con tarea si hay que arreglarlo ---------- */
let paraAnotar = null;
function anotable(ctx){
  paraAnotar = ctx; $('btnAnotar').hidden = false; $('formAnotar').hidden = true;
  $('btnAnotar').textContent = `✎ Agregar anotación · ${ctx.nombre}`;
}
function sinAnotar(){ paraAnotar = null; $('btnAnotar').hidden = true; $('formAnotar').hidden = true; }
$('anotTareaFila').hidden = !C.tareas;
$('btnAnotar').onclick = () => {
  if (!paraAnotar) return;
  $('anotTitulo').textContent = `Anotación · ${paraAnotar.nombre}`;
  $('anotTexto').value = ''; $('anotFotos').value = ''; $('anotTarea').checked = false; $('errAnot').hidden = true;
  $('formAnotar').hidden = false; $('btnAnotar').hidden = true; $('anotTexto').focus();
};
$('btnCancelarAnot').onclick = () => { $('formAnotar').hidden = true; $('btnAnotar').hidden = !paraAnotar; };
$('btnGuardarAnot').onclick = async () => {
  const texto = $('anotTexto').value.trim();
  if (!texto){ $('errAnot').textContent = 'Escribí la anotación.'; $('errAnot').hidden = false; return; }
  const p = procesoActual();
  $('btnGuardarAnot').disabled = true;
  const r = await pedir('POST', 'anotar', {proyecto: paraAnotar.proyecto, mueble: paraAnotar.mueble,
    panel: paraAnotar.panel || '', proceso: p ? p.id : null, texto, tarea: $('anotTarea').checked});
  $('btnGuardarAnot').disabled = false;
  if (!r.ok){ $('errAnot').textContent = r.datos.error; $('errAnot').hidden = false; SONIDOS.mal(); return; }
  const mal = $('anotFotos').files.length
    ? await subirFotos(`${C.api}anotaciones/${r.datos.anotacion.id}/fotos`, $('anotFotos').files) : 0;
  SONIDOS.ok();
  $('formAnotar').hidden = true; $('btnAnotar').hidden = false;
  $('btnAnotar').textContent = `✓ Anotado${r.datos.anotacion.tarea ? ' (con tarea)' : ''}${mal ? ` · ${mal} foto${mal > 1 ? 's' : ''} no se pudo subir` : ''} · otra anotación`;
};

/* ---------- carga: cada bulto al camión (un mueble sin embalar se embala con 1 bulto) ---------- */
// la carga en uso: su título, su link y lo que falta; "nueva" mientras no se escaneó el primer bulto
function usarCarga(id){
  estado.carga = id;
  const c = C.cargas.find(x => x.id === id);
  $('titulo').textContent = c ? c.nombre : 'Carga nueva';
  $('verCarga').hidden = $('btnCerrarCarga').hidden = id === 'nueva';
  $('faltanCarga').hidden = id === 'nueva';
  if (id === 'nueva'){ $('cuenta').textContent = ''; return; }
  $('verCarga').href = C.carga.replace('{id}', id);
  if (c) usarProyecto({id: c.proyecto});
  links();
  pedir('GET', `cargas/${id}`).then(r => r.ok && dibujarCarga(r.datos));
}
async function leerBulto(txt){
  const nueva = estado.carga === 'nueva';
  const r = await pedir('POST', nueva ? 'cargas/nueva/bulto' : `cargas/${estado.carga}/bulto`, {texto: txt, proyecto: estado.proyecto});
  const d = r.datos;
  if (r.ok && faltaProyecto(d, txt)) return;
  if (!r.ok || d.resultado === 'error') return mostrar('mal', d.error || 'No se pudo', '', d.mueble ? `${d.mueble} · bulto ${d.numero}` : '');
  if (nueva){                              // la carga se creó con este bulto: queda elegida para los siguientes
    C.cargas.unshift({id: d.carga.id, proyecto: d.carga.proyecto.id, nombre: `${d.carga.proyecto.nombre} · carga ${d.carga.id}`,
                      estado: d.carga.estado});
    opcionesCarga(); usarCarga(d.carga.id);
    try { localStorage.setItem('puesto.eleccion', JSON.stringify({modo: 'carga', carga: d.carga.id})); } catch (e) {}
  }
  const verbo = 'Cargado';
  anotable({proyecto: d.carga.proyecto.id, mueble: d.mueble, nombre: d.mueble});
  const texto = `${d.mueble} · bulto ${d.numero} de ${d.de}`;
  if (d.resultado === 'ya') mostrar('ya', `Ya estaba ${verbo.toLowerCase()}`, `${d.numero}/${d.de}`, d.mueble,
                                    `${d.ya.por || '—'}, ${cuandoCorto(d.ya.cuando)}`);
  else { mostrar('ok', verbo, `${d.numero}/${d.de}`, d.mueble);
    ultimas.unshift({bulto: d.bulto, corto: `bulto ${d.numero}/${d.de}`, texto}); ultimas = ultimas.slice(0, 10); dibujarUltimas(); }
  dibujarCarga(d.carga);
}
$('btnCerrarCarga').onclick = async () => {
  const c = cargaActual;
  if (!c) return;
  const falta = c.faltantes.length ? `\n\nFaltan ${c.faltantes.length}: quedan para otro envío.\n${c.faltantes.slice(0, 8).join('\n')}` : '';
  if (!confirm(`¿Cerrar la carga ${c.id} (salió a obra) con ${c.cargados} bulto${c.cargados === 1 ? '' : 's'}?${falta}`)) return;
  const motivo = c.faltantes.length ? (prompt('Motivo de lo que falta (opcional):') || '') : '';
  const r = await pedir('POST', `cargas/${c.id}/salir`, {motivo});
  if (!r.ok) return mostrar('mal', r.datos.error || 'No se pudo cerrar');
  C.cargas = C.cargas.filter(x => x.id !== c.id);
  opcionesCarga(); usarCarga('nueva'); cargaActual = null; ultimas = []; dibujarUltimas();
  mostrar('ok', 'Carga cerrada', '', `Carga ${c.id}: salió a obra`, c.faltantes.length ? 'Lo que faltó queda para otro envío' : '');
};
function dibujarCarga(c){
  cargaActual = c;
  $('cuenta').textContent = `${c.cargados} / ${c.total}`;
  const faltan = c.faltantes;
  $('faltanTitulo').textContent = faltan.length ? `Faltan ${faltan.length}` : 'Está todo cargado';
  $('listaFaltan').innerHTML = faltan.map(f => `<li><span>${esc(f)}</span></li>`).join('');
}

/* ---------- escribir o pistola lectora ---------- */
$('formEscribir').onsubmit = e => { e.preventDefault(); const v = $('escrito').value; $('escrito').value = '';
  ultimoTexto = ''; leido(v); };
let tecleo = '', tecleoT = 0;
document.addEventListener('keydown', e => {          // una pistola USB o Bluetooth "escribe" el código y Enter
  if ($('trabajo').hidden || ['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName)) return;
  const ahora = Date.now(); if (ahora - tecleoT > 300) tecleo = ''; tecleoT = ahora;
  if (e.key === 'Enter'){ if (tecleo.length > 2) leido(tecleo); tecleo = ''; }
  else if (e.key.length === 1) tecleo += e.key;
});

/* ---------- cámara (como el escáner del visor, pero no se cierra entre lecturas) ---------- */
let flujo = null, detenido = true, zxing = null;
const FORMATOS = ['code_128','code_39','code_93','ean_13','ean_8','itf','codabar','qr_code','data_matrix'];
async function abrirCamara(){
  detenido = false; $('camMsg').textContent = 'Apuntá a la etiqueta';
  try {
    flujo = await navigator.mediaDevices.getUserMedia({video: {facingMode: 'environment', width: {ideal: 1280}, height: {ideal: 720}}});
  } catch (err) {
    $('camMsg').textContent = 'No se pudo abrir la cámara. Dale permiso al navegador o escribí el código abajo.';
    return;
  }
  const v = $('video'); v.srcObject = flujo; await v.play();
  if ('BarcodeDetector' in window){
    const disp = await BarcodeDetector.getSupportedFormats();
    const det = new BarcodeDetector({formats: FORMATOS.filter(f => disp.includes(f))});
    const leer = async () => {
      if (detenido) return;
      try { const r = await det.detect(v); if (r.length) leido(r[0].rawValue); } catch (e) {}
      setTimeout(() => requestAnimationFrame(leer), 120);
    };
    leer();
  } else {
    try { await cargarZXing(); } catch (e) { return; }
    zxing = new ZXing.BrowserMultiFormatReader();
    zxing.decodeFromVideoElementContinuously(v, res => { if (res && !detenido) leido(res.getText()); });
  }
}
function cargarZXing(){
  if (window.ZXing) return Promise.resolve();
  return new Promise((ok, mal) => { const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js';
    s.onload = ok; s.onerror = () => { $('camMsg').textContent = 'No se pudo cargar el lector. Escribí el código abajo.'; mal(); };
    document.head.appendChild(s); });
}
function detenerCamara(){
  detenido = true;
  if (zxing){ try { zxing.reset(); } catch (e) {} zxing = null; }
  if (flujo){ flujo.getTracks().forEach(t => t.stop()); flujo = null; }
  if (wake){ wake.release().catch(() => {}); wake = null; }
}

// desde el visor o la pantalla de la carga: ya viene elegido, se empieza solo (el sonido se activa al primer toque)
if (q.get('modo') || q.get('c')){
  if (!validarEleccion()){ empezar(); document.addEventListener('pointerdown', activarSonido, {once: true}); }
}
})();
