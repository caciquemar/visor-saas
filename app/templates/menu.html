{# Menú ☰ de las pantallas, igual al del visor (visor/index.html). Lo usan base.html y avance/puesto.html; #}
{# la lista sale de talleres/menu.py. #}
{% if user.is_authenticated %}
<style>
  .menu-app { position:relative; flex:none; }
  .btn-menu { display:grid; place-items:center; width:38px; height:38px; margin-left:-6px; padding:0; color:var(--texto);
              background:none; border:1px solid transparent; border-radius:8px; cursor:pointer; }
  .btn-menu[aria-expanded="true"] { background:var(--fondo); border-color:var(--borde); }
  .menu-lista { position:absolute; left:0; top:calc(100% + 6px); z-index:20; min-width:220px; padding:6px;
                background:var(--panel); border:1px solid var(--borde); border-radius:12px;
                box-shadow:0 8px 24px rgba(27,38,48,.18); display:flex; flex-direction:column; }
  .menu-lista[hidden] { display:none; }
  .menu-lista a, .menu-lista button { display:block; width:100%; padding:10px 12px; border-radius:8px;
              color:var(--texto); font:500 16px system-ui, sans-serif; text-decoration:none; text-align:left;
              background:none; border:0; cursor:pointer; }
  .menu-lista a:hover, .menu-lista button:hover { background:var(--fondo); }
  .menu-lista a[aria-current="page"] { color:var(--acento); font-weight:600; }
  .menu-lista .quien { padding:8px 12px 2px; font-size:13px; color:var(--suave); border-top:1px solid var(--borde);
                       margin-top:4px; }
  .menu-lista form { margin:0; }
</style>
<div class="menu-app">
  <button type="button" class="btn-menu" id="btnMenu" aria-expanded="false" aria-controls="menuLista" aria-label="Menú">
    <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>
  <nav class="menu-lista" id="menuLista" hidden>
    {% for x in menu %}<a href="{{ x.url }}"{% if x.actual %} aria-current="page"{% endif %}>{{ x.nombre }}</a>
    {% empty %}<a href="{% url 'inicio' %}">Mis talleres</a>{% endfor %}
    <div class="quien">{{ user }}</div>
    <form method="post" action="{% url 'salir' %}">{% csrf_token %}<button type="submit">Salir</button></form>
  </nav>
</div>
<script>
(function () {
  const boton = document.getElementById('btnMenu'), lista = document.getElementById('menuLista');
  const abrir = si => { lista.hidden = !si; boton.setAttribute('aria-expanded', si); };
  boton.addEventListener('click', () => abrir(lista.hidden));
  document.addEventListener('pointerdown', e => { if (!e.target.closest('.menu-app')) abrir(false); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !lista.hidden) { abrir(false); boton.focus(); } });
})();
</script>
{% endif %}
