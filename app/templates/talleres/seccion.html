{% extends 'base.html' %}
{% block titulo %}{{ seccion.nombre }}{% endblock %}
{% block cabeza %}{% include 'talleres/botones.html' %}{% endblock %}
{% block contenido %}
<p class="suave" style="margin:0"><a href="{% url 'taller:inicio' taller=request.taller.slug %}">Inicio</a></p>
<h1>{{ seccion.nombre }}</h1>
<nav class="botones" aria-label="{{ seccion.nombre }}">
  {% for p in seccion.pantallas %}
  <a class="boton-grande" href="{{ p.url }}">
    <span><strong>{{ p.nombre }}</strong><span class="suave">{{ p.descripcion }}</span></span>
  </a>
  {% endfor %}
</nav>
{% endblock %}
