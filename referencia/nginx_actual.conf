server {
    listen 8080;   # nginx-unprivileged no puede usar el 80
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types application/json text/css application/javascript;
    gzip_min_length 1024;

    # Trabajos a realizar: servicio "api" del mismo compose (api.py). Con la dirección en una
    # variable nginx arranca aunque ese servicio todavía no exista (la resuelve en cada pedido).
    resolver 127.0.0.11 valid=30s ipv6=off;
    location ^~ /api/ {
        set $api http://api:8000;
        proxy_pass $api;
        proxy_set_header Host $host;
        client_max_body_size 15m;
    }

    # Las reglas con ~ se evalúan en orden y gana la primera: los bloqueos van primero.
    # archivos ocultos (data/.clientes.json tiene los códigos de los links de clientes)
    location ~ /\. { return 404; }
    # no publicar el conversor, la documentación ni la configuración
    location ~* \.(py|txt|yml|conf|bat)$ { return 404; }

    # proyectos: siempre la última versión
    location ~* \.json$ {
        add_header Cache-Control "no-cache";
    }
    # modelos de AR del cliente (Scene Viewer / Quick Look): tipo glTF y siempre la última versión
    location ~* \.glb$ {
        types { }
        default_type model/gltf-binary;
        add_header Cache-Control "no-cache";
    }
    # texturas: cambian de nombre si cambia la imagen
    location /data/texturas/ {
        add_header Cache-Control "public, max-age=604800";
    }
}
